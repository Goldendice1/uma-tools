name: Sync TheCing upstream

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: master-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.merge.outputs.has_changes }}
    steps:
      - name: Checkout master (full history)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream master
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/TheCing/uma-tools.git
          git fetch --no-tags origin master
          git fetch --no-tags upstream master
          git checkout -B master origin/master

          if git merge-base --is-ancestor upstream/master master; then
            echo "Fork master already contains upstream master."
            echo "No upstream changes to sync." >> "$GITHUB_STEP_SUMMARY"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-ff upstream/master -m "Merge upstream TheCing/uma-tools master"; then
            echo "::error::Upstream merge conflict. Aborting without updating master."
            git merge --abort || true
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.merge.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.merge.outputs.has_changes == 'true'
        run: npm ci

      - name: Verify GitHub Pages build
        if: steps.merge.outputs.has_changes == 'true'
        run: npm run build:v2
        env:
          VITE_BASE: ./

      - name: Push validated update
        if: steps.merge.outputs.has_changes == 'true'
        run: git push origin master

      - name: Summarize sync
        if: steps.merge.outputs.has_changes == 'true'
        run: |
          echo "Merged the latest TheCing/uma-tools master into this fork." >> "$GITHUB_STEP_SUMMARY"
          echo "Validated the V2 build before pushing to master." >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-github-pages.yml --ref master
