name: Promote dev → master

# Weekly automated promotion of `dev` to `master` (production).
#
# Cloudflare Pages deploys production from `master`, so a successful run here
# ships whatever is on `dev` to umalator.app. Dev-only features (MooCoins,
# "Still In Love") stay hidden because production builds with CC_DEV=false —
# the build flag decides, not the branch, so merging the source is safe.
#
# Model: direct merge, no PR. A merge conflict FAILS the job (and notifies via
# the normal Actions failure email) rather than force-pushing. The model stays
# clean only if every fix lands on `dev` first — a direct commit to `master`
# will make the next run conflict.
#
# BOOTSTRAP: scheduled workflows only run from the file on the default branch
# (`master`). This file must reach `master` once (via your next manual
# dev → master merge) before the weekly schedule / "Run workflow" button
# become active.
#
# `GITHUB_TOKEN` uses the job-specific permissions below. If branch protection
# is added later, it must allow these Actions pushes.

on:
  schedule:
    # Mondays 14:00 UTC (~09:00–10:00 US Eastern). Adjust to taste.
    - cron: '0 14 * * 1'
  workflow_dispatch: {}      # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: master-updates
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.merge.outputs.has_changes }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # default GITHUB_TOKEN is persisted, so the push below is authenticated

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into master
        id: merge
        run: |
          set -euo pipefail
          git fetch origin dev master

          ahead=$(git rev-list --count origin/master..origin/dev)
          echo "dev is ${ahead} commit(s) ahead of master"
          if [ "${ahead}" -eq 0 ]; then
            echo "Nothing to promote — master already matches dev."
            echo "Nothing to promote — master already matches dev." >> "$GITHUB_STEP_SUMMARY"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Align local master to the remote, then merge dev with an explicit
          # merge commit (matches the existing "Merge branch 'dev'" history).
          git checkout -B master origin/master
          if ! git merge --no-ff origin/dev -m "Merge branch 'dev'"; then
            echo "::error::Merge conflict promoting dev → master. Aborting — resolve manually."
            git merge --abort || true
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.merge.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.merge.outputs.has_changes == 'true'
        run: npm ci

      - name: Verify GitHub Pages build
        if: steps.merge.outputs.has_changes == 'true'
        run: npm run build:v2
        env:
          VITE_BASE: ./

      - name: Push validated promotion
        if: steps.merge.outputs.has_changes == 'true'
        run: git push origin master

      - name: Summarize promotion
        if: steps.merge.outputs.has_changes == 'true'
        run: |
          echo "✅ Promoted ${{ steps.merge.outputs.ahead }} commit(s): dev → master." >> "$GITHUB_STEP_SUMMARY"
          echo "Validated the V2 build before pushing to master." >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    needs: promote
    if: needs.promote.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-github-pages.yml --ref master
